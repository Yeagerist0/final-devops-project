apiVersion: v1
kind: Namespace
metadata:
  name: devops-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-config
  namespace: devops-lab
data:
  GREETING: "Session 21 DevOps Lab"
  DATA_FILE: "/data/tasks.json"
---
# Classroom sample only. Replace before exposing the app outside a local lab.
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-auth
  namespace: devops-lab
type: Opaque
stringData:
  API_TOKEN: "replace-for-your-lab"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskboard-data
  namespace: devops-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: devops-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: taskboard
  template:
    metadata:
      labels:
        app: taskboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: taskboard
          image: ghcr.io/yeagerist0/final-devops-project:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: taskboard-config
            - secretRef:
                name: taskboard-auth
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: taskboard-data
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard
  namespace: devops-lab
spec:
  type: ClusterIP
  selector:
    app: taskboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  namespace: devops-lab
spec:
  ingressClassName: nginx
  rules:
    - host: taskboard.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskboard
                port:
                  name: http
---
# RWO file storage makes this a single-writer classroom deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskboard
  namespace: devops-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskboard
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
